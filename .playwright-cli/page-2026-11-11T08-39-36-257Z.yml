    - region [ref=e127]:
      - heading "How it decides where to step" [level=2] [ref=e128]
      - generic [ref=e129]:
        - paragraph [ref=e130]:
          - text: "The centre of mass moves like an inverted pendulum over the centre of pressure p:"
          - code [ref=e131]: x″ = ω²(x − p)
          - text: ", with"
          - code [ref=e132]: ω = √(g / z₀)
          - text: . Its capture point
          - code [ref=e133]: ξ = x + ẋ/ω
          - text: "is where the robot must put its centre of pressure to come to rest, and it runs away from p:"
          - code [ref=e134]: ξ′ = ω(ξ − p)
          - text: .
        - paragraph [ref=e135]:
          - text: "Ankles first: the centre of pressure goes to the point of the foot nearest ξ, capped by ankle torque and by friction ("
          - code [ref=e136]: "|x − p| ≤ μz"
          - text: ). If the capture point, as seen through the control latency, leaves the foot, the robot steps where ξ will be at touchdown, capped by leg reach, lateral reach and swing time. More than 3 steps, or a slip, is a fall.
        - paragraph [ref=e137]: "The wheeled base has a big footprint and no steps: it drives under the capture point with bounded acceleration and speed, and traction falls with friction. It tips over if ξ escapes faster than it can follow, and is blocked by anything taller than a threshold."