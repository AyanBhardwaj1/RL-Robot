[project]
name = "breakpoint"
version = "0.1.0"
description = "Find where your legged robot breaks before reality does."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "mujoco>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
breakpoint = "breakpoint.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# TRY004: untrusted-input validation raises ValueError on purpose (callers map it to HTTP 422).
# B008: PPOConfig is a frozen dataclass, so a shared default instance is safe.
# S110: LLM failures deliberately degrade to deterministic rules/templates.
ignore = ["TRY004", "B008", "S110"]
