    - generic [ref=e26]:
      - article [ref=e27]:
        - heading "Controls and motion planning" [level=2] [ref=e28]
        - paragraph [ref=e29]: Whole-body control, balance and stepping, MPC, state estimation; real-time C++ and Python.
        - heading "In Breakpoint" [level=3] [ref=e30]
        - list [ref=e31]:
          - listitem [ref=e32]:
            - code [ref=e33]: breakpoint/humanoid.py
            - text: ": linear-inverted-pendulum balance with capture-point stepping, bounded by ankle torque, friction, swing time, leg reach and lateral reach, with slope compensation by leaning."
          - listitem [ref=e34]: "Measured: the biped survives 93 N·s from the front and 77 N·s from the side; 150 ms of lag cuts that roughly in half. A 20 kg tote held in front drops forward pushes from 93 to 78 N·s."
          - listitem [ref=e35]: "Wheeled-base model that drives under its capture point: 146 N·s from the front, but blocked by any curb over 2.5 cm."
        - heading "Next I’d build" [level=3] [ref=e36]
        - paragraph [ref=e37]: A QP whole-body controller on a MuJoCo humanoid that tracks the same capture-point steps, so the reduced model can be checked against full dynamics.
      - article [ref=e38]:
        - heading "Simulation" [level=2] [ref=e39]
        - paragraph [ref=e40]: MuJoCo and Isaac environments, contact models, domain randomization, sim-to-real, MJCF/URDF tooling.
        - heading "In Breakpoint" [level=3] [ref=e41]
        - list [ref=e42]:
          - listitem [ref=e43]:
            - code [ref=e44]: world.py
            - text: builds a 12-joint quadruped and heightfield terrain (rough, slope, stairs) procedurally in MJCF;
            - code [ref=e45]: env.py
            - text: adds PD actuation, latency, sensor noise, pushes at exact gait phases.
          - listitem [ref=e46]: One validated scenario schema clamps every input, whether typed, photographed, generated by an LLM or proposed by search.
          - listitem [ref=e47]: An independent review caught mirrored push directions; a physical regression test now pins the convention.
        - heading "Next I’d build" [level=3] [ref=e48]
        - paragraph [ref=e49]: System identification from logged hardware runs, fitting friction, actuator lag and torque limits so the scenario bounds come from the robot rather than defaults.
      - article [ref=e50]:
        - heading "Robot learning" [level=2] [ref=e51]
        - paragraph [ref=e52]: RL and imitation learning for locomotion and manipulation, foundation and VLA models, sim-to-real.
        - heading "In Breakpoint" [level=3] [ref=e53]
        - list [ref=e54]:
          - listitem [ref=e55]: PPO with hand-written backprop in numpy (checked against finite differences), trained on one CPU core in about 4 minutes.
          - listitem [ref=e56]: "Hardening loop: failures are found, shrunk to minimal tests, replayed in training; a checkpoint ships only if it beats the start."
          - listitem [ref=e57]: "Honest results: one round took readiness 76.5 → 82.6; a second round overfit; latency could not be trained away, so a latency gate took teleop failures from 10% to 0%."
        - heading "Next I’d build" [level=3] [ref=e58]
        - paragraph [ref=e59]: "Use the same audit as an evaluation harness for a learned manipulation policy: grasp success versus tote mass, friction and sensor delay."
      - article [ref=e60]:
        - heading "ML systems and edge deployment" [level=2] [ref=e61]
        - paragraph [ref=e62]: Profiling, quantizing and distilling policies to fit onboard compute; ONNX/TensorRT; latency budgets.
        - heading "In Breakpoint" [level=3] [ref=e63]
        - list [ref=e64]:
          - listitem [ref=e65]:
            - code [ref=e66]: quantize.py
            - text: ": FP16 and per-channel INT8 compression with a robustness check, not just an action-error check."
          - listitem [ref=e67]: "Measured: INT8 is 3.6× smaller (32.3 KB → 9.1 KB) with mean action error 0.002, and readiness unchanged at 84.1 with 0% teleop failures."
          - listitem [ref=e68]: "The FP16 run scored 84.8: a 10⁻⁴ action change moved bisection edges, so the score has about ±0.7 of noise worth reporting."
        - heading "Next I’d build" [level=3] [ref=e69]
        - paragraph [ref=e70]: ONNX export with a real INT8 runtime, and a CI gate that fails when a compressed policy’s breaking point on any axis drops below a set margin.
      - article [ref=e71]:
        - heading "Perception" [level=2] [ref=e72]
        - paragraph [ref=e73]: Detection, segmentation, SLAM, sensor fusion on edge GPUs.
        - heading "In Breakpoint" [level=3] [ref=e74]
        - list [ref=e75]:
          - listitem [ref=e76]: "Photo-to-scenario: explainable surface cues (texture, glare, colour, banding) set roughness, friction and stairs, or a vision LLM fills the same bounded schema."
          - listitem [ref=e77]: Sensor noise is a stress axis; every policy is probed for how much noise it tolerates.
        - heading "Next I’d build" [level=3] [ref=e78]
        - paragraph [ref=e79]: A floor-condition classifier from robot camera frames that predicts the friction band, and a test of how wrong it may be before the odds change.
      - article [ref=e80]:
        - heading "Real-time and embedded" [level=2] [ref=e81]
        - paragraph [ref=e82]: Real-time C++ control loops, EtherCAT and CAN, motor drives, firmware, latency.
        - heading "In Breakpoint" [level=3] [ref=e83]
        - list [ref=e84]:
          - listitem [ref=e85]: "Control latency is modelled at the step level: 20 ms per control tick in the quadruped, continuous in the humanoid."
          - listitem [ref=e86]: "Measured latency budgets: the gated policy tolerates 120 ms; ungated learned policies fail above 40–60 ms."
          - listitem [ref=e87]: "Actuator strength is an axis: the best quadruped policy keeps walking at 21% of nominal torque."
        - heading "Next I’d build" [level=3] [ref=e88]
        - paragraph [ref=e89]: A C++ port of the capture-point controller with a fixed-rate loop and jitter injection, benchmarked against the Python reference.
      - article [ref=e90]:
        - heading "Platform and developer tools" [level=2] [ref=e91]
        - paragraph [ref=e92]: Build systems, CI/CD, developer experience, internal tools, AI-assisted workflows.
        - heading "In Breakpoint" [level=3] [ref=e93]
        - list [ref=e94]:
          - listitem [ref=e95]: 81 tests, lint-clean, CI on every push; the browser port is tested against the Python model so the two cannot drift.
          - listitem [ref=e96]: A CLI with 13 commands, a local and a serverless web lab, reproducible scripts for every committed result.
          - listitem [ref=e97]: Built with an AI coding agent, then reviewed twice by independent reviewers; 17 findings fixed with regression tests.
        - heading "Next I’d build" [level=3] [ref=e98]
        - paragraph [ref=e99]:
          - text: An editor extension that runs
          - code [ref=e100]: breakpoint run
          - text: on the scenario under the cursor and shows the replay inline.
      - article [ref=e101]:
        - heading "Fleet and integration" [level=2] [ref=e102]
        - paragraph [ref=e103]: Fleet software, APIs to warehouse and plant systems, monitoring, uptime.
        - heading "In Breakpoint" [level=3] [ref=e104]
        - list [ref=e105]:
          - listitem [ref=e106]: Deployment profiles turn a site into a distribution of conditions; failure odds come with a 95% upper bound and causes.
          - listitem [ref=e107]:
            - text: A stateless HTTP API (
            - code [ref=e108]: /api/simulate
            - text: ","
            - code [ref=e109]: /api/deploy
            - text: ","
            - code [ref=e110]: /api/probe
            - text: ) with validation, size caps and caching.
          - listitem [ref=e111]: "Humanoid job odds: biped 0% vs wheeled 47% on home-care routes (stairs), wheeled 16% on trailer unloading (lips and debris)."
        - heading "Next I’d build" [level=3] [ref=e112]
        - paragraph [ref=e113]: "Fleet telemetry in, deployment profile out: fit a site’s profile from logged pushes, slips and lag, then re-run the odds nightly."
      - article [ref=e114]:
        - heading "Test and validation" [level=2] [ref=e115]
        - paragraph [ref=e116]: Hardware-in-the-loop and simulation tests, regression suites, coverage, release gates.
        - heading "In Breakpoint" [level=3] [ref=e117]
        - list [ref=e118]:
          - listitem [ref=e119]:
            - text: Shrunk counterexamples saved as JSON with seeds;
            - code [ref=e120]: regress
            - text: replays them on 3 seeds and exits non-zero on failure.
          - listitem [ref=e121]:
            - code [ref=e122]: certify
            - text: writes a certificate with the policy’s SHA-256, toolchain versions and git commit, and fails CI below a score.
          - listitem [ref=e123]: "Compound stress: two stresses that each pass alone at 75% of their limits can fail together."
        - heading "Next I’d build" [level=3] [ref=e124]
        - paragraph [ref=e125]: The same suite runner against a hardware-in-the-loop target, with the simulator and the bench sharing one scenario file.
      - article [ref=e126]:
        - heading "Safety" [level=2] [ref=e127]
        - paragraph [ref=e128]: Hazard analysis, functional safety (IEC 61508, ISO 13849, ISO 10218), safety for learned systems.
        - heading "In Breakpoint" [level=3] [ref=e129]
        - list [ref=e130]:
          - listitem [ref=e131]: "Every failure rate carries a 95% upper bound, and every report states its search budget: no failure found is not proof of none."
          - listitem [ref=e132]: Failures are explained from evidence, for example “fell 0.7 s after a 12 N·s shove from the right with slippery ground and a 3 kg payload”.
          - listitem [ref=e133]: Biped versus wheeled odds by job make the stability trade-off explicit.
        - heading "Next I’d build" [level=3] [ref=e134]
        - paragraph [ref=e135]: Map each failure class to a hazard log entry with severity and mitigation, so the audit feeds the hazard analysis directly.
      - article [ref=e136]:
        - heading "Data and teleoperation" [level=2] [ref=e137]
        - paragraph [ref=e138]: Collecting demonstrations at scale for foundation models; teleoperation over networks.
        - heading "In Breakpoint" [level=3] [ref=e139]
        - list [ref=e140]:
          - listitem [ref=e141]: A teleoperated data-collection job profile with 50–250 ms of network lag.
          - listitem [ref=e142]: "Finding: learned policies are the latency-sensitive part; gating them on measured link latency removed every teleop failure."
        - heading "Next I’d build" [level=3] [ref=e143]
        - paragraph [ref=e144]: An episode filter that tags recorded demonstrations whose lag or near-falls would teach a policy the wrong thing.
